<style>
:root{ --bg:#0d0c0f; --panel:#15131a; --fg:#f3ede4; --muted:#a49d95; --faint:#6f6a73;
  --accent:#e8863a; --accent2:#f2b14e; --line:rgba(255,255,255,.12);
  --disp:"Frank Ruhl Libre",Georgia,serif; --body:"Heebo",Arial,sans-serif; color-scheme:dark; direction:rtl; }
*{box-sizing:border-box} html,body{margin:0}
body{background:radial-gradient(120% 80% at 50% 0%,#1a1620,#0d0c0f 62%) fixed,#0d0c0f;color:var(--fg);font-family:var(--body);font-weight:300;-webkit-font-smoothing:antialiased;overflow-x:hidden}
.gut{padding:clamp(18px,4vw,42px)}
header.hd{text-align:center;padding-top:clamp(20px,5vw,46px)}
.kick{letter-spacing:.3em;font-size:12px;color:var(--accent2);font-weight:500}
h1{font-family:var(--disp);font-weight:900;font-size:clamp(2rem,6vw,3.4rem);margin:.5rem 0 .3rem}
.sub{color:var(--muted);font-size:clamp(.95rem,2.2vw,1.15rem)}
section{max-width:1180px;margin:0 auto}
.secttl{display:flex;align-items:center;gap:.8rem;margin:clamp(1.6rem,4vw,2.6rem) 0 1rem}
.secttl h2{font-family:var(--disp);font-weight:900;font-size:clamp(1.5rem,4vw,2.2rem);margin:0}
.secttl .ln{flex:1;height:1px;background:linear-gradient(90deg,var(--accent),transparent)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:clamp(10px,2vw,20px);box-shadow:0 24px 60px rgba(0,0,0,.45)}
.tmap,.mmap{width:100%;height:auto;display:block}
.tmap .region{fill:var(--faint);font-family:var(--body);font-weight:500;font-size:22px;letter-spacing:2px;opacity:.55}
.tmap .route-base{fill:none;stroke:var(--accent);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:.9;stroke-dasharray:1;animation:draw 2.6s ease forwards}
.tmap .route-flow{fill:none;stroke:var(--accent2);stroke-width:3.4;stroke-linecap:round;stroke-dasharray:2 15;opacity:.95;animation:flow 1.3s linear infinite}
.tmap .fly{fill:none;stroke:var(--accent2);stroke-width:2;stroke-dasharray:7 9;opacity:.7}
.tmap .flytag{fill:var(--accent2);font-family:var(--body);font-size:15px;opacity:.85}
.tmap .dot{fill:var(--accent2);stroke:#0d0c0f;stroke-width:3}
.tmap .pulse{fill:var(--accent2);opacity:.4;transform-box:fill-box;transform-origin:center;animation:pulse 3.2s ease-out infinite;animation-delay:var(--d)}
.tmap .pnum{fill:#0d0c0f;font-family:var(--body);font-weight:700;font-size:14px}
.tmap .plabel{fill:var(--fg);font-family:var(--disp);font-weight:700;font-size:22px}
.tmap .pch{fill:var(--accent2);font-family:var(--body);font-weight:400;font-size:13px;letter-spacing:1px}
@keyframes flow{to{stroke-dashoffset:-34}} @keyframes pulse{0%{transform:scale(1);opacity:.4}70%,100%{transform:scale(3);opacity:0}}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
.mmap .mln{fill:none;stroke-width:3;opacity:.85}
.mmap .mln2{fill:none;stroke-width:1.6;opacity:.6}
.mmap .rootbox{fill:#231b10;stroke:var(--accent2);stroke-width:2}
.mmap .roott{fill:var(--accent2);font-family:var(--disp);font-weight:900;font-size:30px}
.mmap .chapt{fill:#160f06;font-family:var(--disp);font-weight:700;font-size:22px}
.mmap .leaft{fill:#e7ddcf;font-family:var(--body);font-weight:400;font-size:18px}
.note{text-align:center;color:var(--faint);font-size:12px;letter-spacing:.12em;margin-top:.7rem}
.foot{text-align:center;color:var(--faint);font-size:12px;letter-spacing:.3em;padding:1.4rem 0 2.4rem}
</style>
